name: Build Debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build Glassly Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Gradle CLI for wrapper generation
        if: hashFiles('gradlew') == '' || hashFiles('gradle/wrapper/gradle-wrapper.jar') == ''
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      - name: Verify or generate Gradle wrapper
        run: |
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 9.3.1 --no-daemon
          fi
          chmod +x gradlew

      - name: Prepare debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 --decode debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --console=plain

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-reports
          path: |
            **/build/reports/**
          if-no-files-found: ignore

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: glassly-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
